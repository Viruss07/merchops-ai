name: Keep Warm & Production Health

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Health Probe
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "[INFO] PRODUCTION_URL secret is not set yet. Skipping ping until deployed."
            exit 0
          fi
          echo "Pinging ${PROD_URL}/api/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/api/health" || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Health probe did not return 200 OK"
            exit 1
          fi
          echo "Production deployment is warm and healthy."

